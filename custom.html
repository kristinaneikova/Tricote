<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Персонализирана поръчка | Tricoté</title>
  <meta name="description" content="Поръчайте ръчно плетено изделие по ваши изисквания: цвят, размер, надпис.">
  <link rel="icon" href="logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Prata&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="custom">
  <div id="site-header"></div>

  <main id="main" tabindex="-1">
    <section class="page-top">
      <div class="wrap" style="max-width:900px">
        <div class="stack gap12" style="text-align:center;align-items:center;margin-bottom:32px">
          <span class="tag">Изработка по ваши изисквания</span>
          <h1 style="font-size:clamp(36px,5vw,54px)">Персонализирана поръчка</h1>
          <p class="muted" style="font-size:19px;max-width:620px">Опишете идеята си и ще се свържем с вас с цена и срок за изработка.</p>
        </div>

        <div id="customWrap">
          <form class="box" style="padding:34px" data-form="custom" novalidate>
            <div class="fields" style="gap:26px">
              <fieldset>
                <legend class="big">1. Какво да изплетем?</legend>
                <div class="opts">
                  <label class="opt"><input type="radio" name="kind" value="Чанта" checked>Чанта</label>
                  <label class="opt"><input type="radio" name="kind" value="Играчка">Играчка</label>
                  <label class="opt"><input type="radio" name="kind" value="Ключодържател">Ключодържател</label>
                  <label class="opt"><input type="radio" name="kind" value="Друго">Друго</label>
                </div>
              </fieldset>

              <fieldset>
                <legend class="big">2. Детайли</legend>
                <div class="fields">
                  <div class="grid g2" style="gap:14px">
                    <label class="f">Основен цвят<input class="input" name="color1" placeholder="напр. винено червено" required><span class="err">Изберете поне един цвят.</span></label>
                    <label class="f">Допълнителен цвят<input class="input" name="color2"></label>
                    <label class="f">Размер
                      <select class="input" name="size">
                        <option>Малък</option>
                        <option selected>Среден</option>
                        <option>Голям</option>
                        <option>Друг (опишете)</option>
                      </select>
                    </label>
                    <label class="f">Количество<input class="input" type="number" name="qty" min="1" value="1" required><span class="err">Поне 1 брой.</span></label>
                  </div>
                  <label class="f">Надпис или име (по желание)<input class="input" name="label" maxlength="30"></label>
                  <label class="f">Опишете идеята<textarea class="input" name="idea" required></textarea><span class="err">Разкажете ни малко повече.</span></label>
                  <label class="f">Снимка за вдъхновение (по желание)<input class="input" type="file" name="photo" accept="image/*" style="padding-top:12px"></label>
                  <label class="f">Желан срок<input class="input" type="date" name="date"></label>
                </div>
              </fieldset>

              <fieldset>
                <legend class="big">3. Данни за контакт</legend>
                <div class="grid g2" style="gap:14px">
                  <label class="f">Име и фамилия<input class="input" name="name" required autocomplete="name"><span class="err">Въведете име.</span></label>
                  <label class="f">Телефон<input class="input" type="tel" name="phone" required autocomplete="tel"><span class="err">Въведете телефон.</span></label>
                </div>
                <label class="f" style="margin-top:14px">Имейл<input class="input" type="email" name="email" required autocomplete="email"><span class="err">Въведете валиден имейл.</span></label>
              </fieldset>

              <button class="btn" type="submit" style="justify-self:start">Изпрати запитването</button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="app.js"></script>
</body>
</html>
